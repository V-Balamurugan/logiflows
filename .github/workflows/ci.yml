name: LogiFlows CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-insecure-secret-key-for-ci-pipeline-only
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django system check
        run: |
          cd backend
          python manage.py check --settings=config.settings.test

      - name: Verify migration consistency
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run Pytest test suite with coverage
        run: |
          cd backend
          pytest -v --cov=apps --cov-report=term-missing --cov-fail-under=85

  frontend-test:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type checking and production bundle build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest unit & component test suite
        run: |
          cd frontend
          npm test

  docker-verification:
    name: Docker Stack Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Build Docker images
        run: |
          docker compose build --no-cache

  e2e-test:
    name: End-to-End Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers with OS dependencies
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start Docker Compose services
        run: |
          docker compose up -d --build
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/v1/health/ | grep -q "healthy"; then
              echo "Backend service is healthy!"
              break
            fi
            echo "Waiting for backend service to become healthy... ($i/30)"
            sleep 2
          done

      - name: Run Playwright E2E test suite (Full Auth Lifecycle)
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

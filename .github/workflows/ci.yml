name: LogiFlows CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-insecure-secret-key-for-ci-pipeline-only
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django system check
        run: |
          cd backend
          python manage.py check --settings=config.settings.test

      - name: Verify migration consistency
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run Pytest test suite with coverage
        run: |
          cd backend
          pytest -v --cov=apps --cov-report=term-missing --cov-fail-under=85

  frontend-test:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type checking and production bundle build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest unit & component test suite
        run: |
          cd frontend
          npm test

  docker-verification:
    name: Docker Stack Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Build Docker images
        run: |
          docker compose build --no-cache
